apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: canduril
  labels:
    app: gateway
    component: canduril
spec:
  replicas: 2  # for high availability
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        component: canduril
    spec:
      containers:
      - name: gateway
        image: canduril-gateway:latest
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: canduril-config
        - secretRef:
            name: canduril-postgres
        volumeMounts:
        - name: gateway-config
          mountPath: /app/services/gateway/config.json
          subPath: config.json
        ports:
        - containerPort: 8000
          name: websocket
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # Gateway already has a real FastAPI /health endpoint (needed for
        # the WebSocket server regardless), unlike the other three
        # services, so this uses a real httpGet probe rather than the
        # exec no-op the others use.
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: gateway-config
        configMap:
          name: canduril-gateway-config
          items:
          - key: config.json
            path: config.json

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: canduril
  labels:
    app: gateway
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: websocket
  selector:
    app: gateway
