apiVersion: v1
kind: Secret
metadata:
  name: canduril-postgres
  namespace: canduril
type: Opaque
data:
  PG_PASSWORD: Y2FuZHVyaWw=

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: canduril
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: canduril-postgres
              key: PG_PASSWORD
        - name: POSTGRES_DB
          value: canduril
        # No init-script mount -- PostgresSnapshotStore.ensure_schema()
        # creates both tables from Python on service startup.
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: canduril
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app: postgres
